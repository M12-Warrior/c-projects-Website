<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packet | Mile 12 Warrior</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .packet-page-intro { margin-bottom: 24px; }
    .packet-page-actions { display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
    .packet-page-actions .btn { width: 100%; justify-content: center; }
    .packet-page-note { font-size: 0.88rem; color: var(--text-2); line-height: 1.55; max-width: 640px; margin-top: 16px; }
    .packet-page-panel { padding: 28px; }
    .fleet-yard-panel summary::-webkit-details-marker,
    .fleet-prefill-panel summary::-webkit-details-marker,
    .fleet-prefill-section summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="grain-overlay"></div>
  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo"><img src="/images/logo.png" alt="Mile 12 Warrior" class="nav-logo-img"></a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/#packets">Packets</a></li>
        <li><a href="/services">Services</a></li>
        <li><a href="/social-butterflies">Social Butterflies</a></li>
        <li><a href="/wellness">Wellness Partners</a></li>
        <li><a href="/shop">Shop</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </div>
  </nav>
  <main id="main-content" class="page-shell">
    <div class="page-container">
      <div class="packet-page-intro" id="packetIntro">
        <div class="packet-tier packet-tier-free" id="packetTier">FREE</div>
        <h1 class="page-title" id="packetTitle">Safety Packet</h1>
        <p class="page-subtitle" id="packetSubtitle">View, print, or download this packet &mdash; free access, no checkout.</p>
        <p style="margin-top:12px"><a href="/#packets" class="btn btn-secondary" style="text-decoration:none">Back to packets</a></p>
      </div>
      <div class="glass-card packet-page-panel">
        <div id="fleetYardHostPacket" style="display:none;max-width:720px;margin-bottom:18px"></div>
        <div class="packet-page-actions" id="packetActions"></div>
        <p class="packet-page-note" id="packetNote"></p>
      </div>
    </div>
  </main>
  <script src="/js/packets.js"></script>
  <script src="/js/main.js"></script>
  <script>
    (function () {
      var PAGES = {
        'seasoned-driver': {
          title: 'Seasoned Driver Packet',
          tier: 'Tier 2 &mdash; FREE',
          subtitle: 'Advanced safety and wellness for experienced drivers (2+ years). 11 print-ready sections.',
          type: 'seasoned-driver',
          fleet: false,
          note: 'Print opens a new tab &mdash; use your browser Print to save as PDF. Download saves an HTML file you can open offline.'
        },
        'fleet-new-hire': {
          title: 'Fleet New Hire Orientation Packet',
          tier: 'Fleet &mdash; FREE',
          subtitle: 'Complete onboarding package for safety departments with sign-off sheets per 49 CFR 391.51.',
          type: 'fleet-new-hire',
          fleet: true,
          note: 'Optional panel above lets you pre-fill company name, Safety Chain of Command, and key contacts before print. Saved on this device only.'
        },
        'fleet-refresher': {
          title: 'Fleet Seasoned Driver Refresher Packet',
          tier: 'Fleet &mdash; FREE',
          subtitle: 'Annual or semi-annual refresher with fatigue self-assessment, seasonal hazard calendar, and sign-off sheets.',
          type: 'fleet-refresher',
          fleet: true,
          note: 'Optional panel above lets you pre-fill company name, emergency contacts, and yard label before print. Saved on this device only.'
        }
      };

      var pathKey = (window.location.pathname || '').replace(/^\/packets\//, '').replace(/\/$/, '');
      var meta = PAGES[pathKey];
      if (!meta) {
        document.getElementById('packetTitle').textContent = 'Packet not found';
        document.getElementById('packetSubtitle').textContent = 'This packet page does not exist.';
        document.getElementById('packetActions').innerHTML = '<a href="/#packets" class="btn btn-primary" style="text-decoration:none">Browse packets</a>';
        return;
      }

      document.title = meta.title + ' | Mile 12 Warrior';
      document.getElementById('packetTier').textContent = meta.tier;
      document.getElementById('packetTitle').textContent = meta.title;
      document.getElementById('packetSubtitle').textContent = meta.subtitle;
      document.getElementById('packetNote').textContent = meta.note;

      if (meta.fleet) {
        var yardHost = document.getElementById('fleetYardHostPacket');
        if (yardHost) {
          yardHost.style.display = 'block';
          if (typeof Packets !== 'undefined' && Packets.mountFleetYardPanel) {
            Packets.mountFleetYardPanel(yardHost, { openIfFilled: true });
          }
        }
      }

      var viewFn = meta.fleet ? 'Packets.viewFleet' : 'Packets.viewGated';
      var printFn = meta.fleet ? 'Packets.printFleet' : 'Packets.printGated';
      var downloadFn = meta.fleet ? 'Packets.downloadFleet' : 'Packets.downloadGated';
      var typeArg = "'" + meta.type.replace(/'/g, "\\'") + "'";

      document.getElementById('packetActions').innerHTML =
        '<button type="button" class="btn btn-primary" onclick="' + viewFn + '(' + typeArg + ')"><span>View Packet Online</span></button>' +
        '<button type="button" class="btn btn-secondary" onclick="' + printFn + '(' + typeArg + ')"><span>Print / Save as PDF</span></button>' +
        '<button type="button" class="btn btn-secondary" onclick="' + downloadFn + '(' + typeArg + ')"><span>Download Packet</span></button>';

      if (typeof Packets !== 'undefined' && Packets.loadAccessConfig) {
        Packets.loadAccessConfig();
      }
    })();
  </script>
</body>
</html>
